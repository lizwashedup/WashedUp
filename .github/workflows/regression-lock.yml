name: Regression Lock

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      # The native traceability manifest also points at two private sibling
      # repositories. Their existence is checked by local workspace QA; this
      # single-repository runner defers only those explicit external paths.
      TRACEABILITY_EXTERNAL_EVIDENCE: defer
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.1'
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.5

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare production-parity PostgreSQL image
        run: docker pull postgres:17-alpine

      - name: Run mandatory regression lock
        run: npm run qa:all
